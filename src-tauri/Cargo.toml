[package]
name = "anna_store_pos"
version = "0.1.0"
description = "Yassine Arabic shop desktop POS"
authors = ["Yassine Shop"]
edition = "2021"

[lib]
name = "anna_store_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "1"
